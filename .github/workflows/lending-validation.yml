name: Lending validation
on: [pull_request]
permissions:
  contents: read
jobs:
  validate:
    name: lending-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm test
      - run: npm run build
